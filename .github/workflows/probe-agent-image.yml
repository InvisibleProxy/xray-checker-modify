name: Probe agent image

# Publishes the remote diagnostic probe agent to GHCR so probes can be deployed
# from the Compose file the admin UI generates, without a checkout on the host.
#
# Tags come from two sources:
#   push to main          -> :main and :sha-<short>
#   tag probe-agent-vX.Y.Z -> :X.Y.Z and :latest
#
# The probe-agent- prefix is deliberate: plain v* tags belong to the upstream
# kutovoys/xray-checker repository and arrive here through `git fetch upstream
# --tags`, which must not trigger a publish.

on:
  push:
    branches: [main]
    tags: ['probe-agent-v*']
  workflow_dispatch:

concurrency:
  group: probe-agent-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/invisibleproxy/xray-checker-probe-agent

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dockerfile.agent cross-compiles Go, but its final stage still runs
      # apk/adduser under the target architecture, so arm64 needs emulation.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=match,pattern=probe-agent-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/probe-agent-v') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_TAG=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations would add an unknown/unknown entry to the published
          # platform list, which reads as a broken multi-arch manifest.
          provenance: false

      - name: Summarise the published image
        run: |
          {
            echo '## Probe agent image'
            echo
            echo 'Pin this exact build on the controller:'
            echo
            echo '```dotenv'
            echo "PROBE_AGENT_IMAGE=${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo 'Tags published:'
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
