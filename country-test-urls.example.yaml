# Country-specific reserve Test URLs for xray-checker.
#
# Copy this file to data/country-test-urls.yaml and edit the local copy.
# Country keys are ISO 3166-1 alpha-2 codes. The checker matches them against
# the country declared by the node name/subscription, never against GeoIP.
#
# priority is only the deterministic initial order. Runtime health, per-node
# last success and cooldowns take precedence. The checker does not rank URLs by
# measured Mbps, because that would make node-speed history incomparable.
#
# enabled defaults to true when omitted. Endpoint ids must be globally unique.

version: 1

countries:
  DE:
    - id: hostkey-frankfurt
      provider: HOSTKEY
      city: Frankfurt
      url: https://spd-desrv.hostkey.com/files/100mb.bin
      priority: 10
      enabled: true
      source: https://hostkey.com/documentation/technical/exist_server_using/speedtest/

    - id: edis-frankfurt
      provider: EDIS Global
      city: Frankfurt
      url: https://de.edisglobal.com/100MB.test
      priority: 20
      enabled: true
      source: https://de.edisglobal.com/

    - id: leaseweb-frankfurt-fra1
      provider: Leaseweb
      city: Frankfurt
      url: http://speedtest.fra1.de.leaseweb.net/100mb.bin
      priority: 30
      enabled: true
      source: https://kb.leaseweb.com/kb/network/network-link-speeds/

    - id: hetzner-falkenstein-fsn1
      provider: Hetzner
      city: Falkenstein
      url: https://fsn1-speed.hetzner.com/100MB.bin
      priority: 40
      # Official endpoint, but disabled after repeated TLS failures from the
