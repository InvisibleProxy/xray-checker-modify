        scope:
          type: string
        subscription:
          type: string
        stableIds:
          type: array
          items:
            type: string
        nodeNames:
          type: array
          items:
            type: string
        affectedCount:
          type: integer
        totalCount:
          type: integer
        causeCode:
          type: string
        causeSummary:
          type: string
        causeDetail:
          type: string
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        durationSec:
          type: integer
          format: int64

    TelegramAdminConfig:
      type: object
      required: [enabled, commandPollingEnabled, speedReportsEnabled, speedReportMode, nodeAlertsEnabled]
      properties:
        enabled:
          type: boolean
        commandPollingEnabled:
          type: boolean
        speedReportsEnabled:
          type: boolean
        speedReportMode:
          type: string
          enum: [always, issues, disabled]
        lowSpeedThresholdMbps:
          type: number
          format: double
        speedReportLimit:
          type: integer
        nodeAlertsEnabled:
          type: boolean
        alertCheckMinutes:
          type: integer
        alertAfterFailures:
          type: integer
        alertRepeatMinutes:
          type: integer
        alertDiagnosticsMinutes:
          type: integer
        alertReminderScheduleMinutes:
          type: array
          items:
            type: integer
        alertMaxReminderMinutes:
          type: integer
        groupOfflineReminders:
          type: boolean
        notifyRecovery:
          type: boolean
        mutedNodeIds:
          type: array
          items:
            type: string
        mutedSpeedNodeIds:
          type: array
          items:
            type: string
        mutedAlertNodeIds:
          type: array
          items:
            type: string
        botTokenConfigured:
          type: boolean
          readOnly: true
        chatConfigured:
          type: boolean
          readOnly: true
        messageThreadConfigured:
          type: boolean
          readOnly: true
        adminUserCount:
          type: integer
          readOnly: true

    RemnawaveMessageScenario:
      type: object
      required: [enabled, template]
      properties:
        enabled:
          type: boolean
          description: Whether this user-impact state may publish or retain a managed status line.
        template:
          type: string
          minLength: 1
          maxLength: 240
          description: Single-line URL-free template. Supported placeholders depend on the scenario.

    RemnawaveMessageScenarios:
      type: object
      required: [singleLocation, multipleLocations, allLocations, partialSingleLocation, partialMultipleLocations, maintenanceSingleLocation, maintenanceMultipleLocations, healthy, partialFallback, partialAvailabilityFallback, maintenanceFallback, maintenanceMixedFallback]
      properties:
        singleLocation:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Supports {location}, {unavailable}, and {total}.
        multipleLocations:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Supports {locations}, {unavailable}, and {total}.
        allLocations:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Supports {unavailable} and {total}.
        partialSingleLocation:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Used when at least one server remains healthy in one location. Supports {location}, {affected}, and {total}.
        partialMultipleLocations:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Used when at least one server remains healthy in several locations. Supports {locations}, {affected}, and {total}.
        maintenanceSingleLocation:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Used when every member of one location is offline and in maintenance. Supports {location}, {affected}, and {total}.
        maintenanceMultipleLocations:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Used when every member is offline and in maintenance in several locations. Supports {locations}, {affected}, and {total}.
        healthy:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Supports {unavailable} and {total}. Disabled restores the preserved base after recovery.
        partialFallback:
          type: string
          minLength: 1
          maxLength: 240
          description: Supports {unavailable} and {total}; used for more than three unavailable locations or an oversized rendered list.
        partialAvailabilityFallback:
          type: string
          minLength: 1
          maxLength: 240
          description: Supports {affected} and {total}; used for more than three partially unavailable locations or an oversized rendered list.
        maintenanceFallback:
          type: string
          minLength: 1
          maxLength: 240
          description: Supports {affected} and {total}; used for more than three maintenance locations or an oversized rendered list.
        maintenanceMixedFallback:
          type: string
          minLength: 1
          maxLength: 240
          description: Supports {unavailable}, {affected}, and {total}; used when combined outage and maintenance messages exceed 240 characters.

    RemnawavePolicy:
      type: object
      required: [enabled, outageMinutes, minimumFailures, recoveryMinutes]
      properties:
        enabled:
          type: boolean
        outageMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        minimumFailures:
          type: integer
          minimum: 2
          maximum: 100
          description: Consecutive full availability iterations; manual and fast-recovery checks do not increment this counter.
        recoveryMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        messages:
          $ref: '#/components/schemas/RemnawaveMessageScenarios'
        normalMessage:
          type: string
          maxLength: 240
          deprecated: true
          description: Legacy v1 input accepted for compatibility and migrated to messages.healthy.

    RemnawaveSquadPair:
      type: object
      required: [internalSquadUuid, externalSquadUuid]
      properties:
        internalSquadUuid:
          type: string
        externalSquadUuid:
          type: string
        monitoringOnly:
          type: boolean
          default: false
          description: The pair participates in topology modeling but its External Squad is never targeted.

    RemnawaveNodeMapping:
      type: object
      deprecated: true
      description: Legacy server-first mapping accepted for compatibility when locations is omitted or equivalent.
      required: [hostUuid]
      properties:
        hostUuid:
          type: string
        groupKey:
          type: string
          maxLength: 128
          description: Stable public-location redundancy key; defaults to Host UUID.
        publicLabel:
          type: string
          maxLength: 80
          description: Legacy user-facing location label. Canonical locations use their enclosing map key and do not derive identity from Host remarks.

    RemnawaveLocation:
      type: object
      required: [members]
      properties:
        publicLabel:
          type: string
          maxLength: 80
          description: User-facing location label. The enclosing map key is the stable location identity.
        members:
          type: object
          minProperties: 1
          description: Map keyed by exact checker StableID with the corresponding Remnawave Host UUID as its value. Members are filtered by audience before the location state is evaluated.
          additionalProperties:
            type: string

    RemnawaveSettings:
      type: object
      required: [policy, squadPairs]
      description: Location-first settings. Current clients use locations; legacy clients may send nodeMappings when locations is omitted. If both mapping shapes are supplied, they must describe the same locations.
      anyOf:
        - required: [locations]
        - required: [nodeMappings]
      properties:
        policy:
          $ref: '#/components/schemas/RemnawavePolicy'
        squadPairs:
          type: array
          items:
            $ref: '#/components/schemas/RemnawaveSquadPair'
        locations:
          type: object
          description: Map keyed by a stable public-location key. Adding or replacing members does not create a new announce binding.
          additionalProperties:
            $ref: '#/components/schemas/RemnawaveLocation'
        nodeMappings:
          type: object
          deprecated: true
          description: Legacy map keyed by exact checker StableID. Accepted when locations is omitted or describes the same locations.
          additionalProperties:
            $ref: '#/components/schemas/RemnawaveNodeMapping'

    RemnawaveHost:
      type: object
      properties:
        uuid:
          type: string
        remark:
          type: string
        address:
          type: string
        port:
          type: integer
        isDisabled:
          type: boolean
        isHidden:
          type: boolean
        inbound:
          type: object
          properties:
            configProfileUuid:
              type: string
            configProfileInboundUuid:
              type: string
        internalSquads:
          type: object
          description: >-
            Which internal squads may see this host. The list is read as a deny-list under
            EXCLUDE and as an allow-list under ALLOW_ONLY.
          properties:
            mode:
              type: string
              enum: [EXCLUDE, ALLOW_ONLY]
            squads:
              type: array
              items:
                type: string
        excludedInternalSquads:
          type: array
          description: Deprecated pre-3.4 shape of internalSquads, kept for panels that still send it.
          items:
            type: string

    RemnawaveInternalSquad:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        inbounds:
          type: array
          description: Safe identity fields only; rawInbound is never exposed.
          items:
            type: object
            properties:
              uuid:
                type: string
              profileUuid:
                type: string
              tag:
                type: string
              type:
                type: string

    RemnawaveExternalSquad:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string

    RemnawaveCandidateMember:
      type: object
      description: A checker node and the Remnawave Host it was paired with by address and port.
      properties:
        stableId:
          type: string
        nodeName:
          type: string
        endpoint:
          type: string
          example: 144.31.86.63:8443
        hostUuid:
          type: string
          description: Empty when the node matched no host.
        hostRemark:
          type: string

    RemnawaveSnapshot:
      type: object
      required: [connection, settings, topology, proxies, status]
      properties:
        connection:
          type: object
          properties:
            enabled:
              type: boolean
            configured:
              type: boolean
            apiUrl:
              type: string
            apiTokenConfigured:
              type: boolean
        settings:
          $ref: '#/components/schemas/RemnawaveSettings'
        topology:
          type: object
          properties:
            loadedAt:
              type: string
              format: date-time
            hosts:
              type: array
              items:
                $ref: '#/components/schemas/RemnawaveHost'
            internalSquads:
              type: array
              items:
                $ref: '#/components/schemas/RemnawaveInternalSquad'
            externalSquads:
              type: array
              items:
                $ref: '#/components/schemas/RemnawaveExternalSquad'
        proxies:
          type: array
          items:
            type: object
            properties:
              stableId:
                type: string
              name:
                type: string
              subName:
                type: string
              server:
                type: string
              port:
                type: integer
              protocol:
                type: string
        status:
          type: object
          properties:
            lastTopologyAt:
              type: string
              format: date-time
            lastReconcileAt:
              type: string
              format: date-time
            lastError:
              type: string
            conflicts:
              type: array
              items:
                type: string
            announcements:
              type: array
              items:
                type: object
                properties:
                  externalSquadUuid:
                    type: string
                  externalSquadName:
                    type: string
                  present:
                    type: boolean
                  managed:
                    type: boolean
                  preservesBase:
                    type: boolean
                    description: The original single-line rwEncodeBase64 announce is preserved as the first line
                  message:
                    type: string

    CreateDiagnosticAgentRequest:
      type: object
      required: [displayName, expectedSourceIp, controllerIp, controllerUrl]
      properties:
        displayName: {type: string, maxLength: 80}
        expectedSourceIp:
          type: string
          description: Exact public IPv4 or IPv6 source address expected by the controller.
        controllerIp:
          type: string
          description: Exact controller IPv4 or IPv6 address pinned by the agent control client.
        controllerUrl: {type: string, format: uri}
        region: {type: string, maxLength: 80}
        provider: {type: string, maxLength: 80}
        networkGroup: {type: string, maxLength: 80}

    DiagnosticAgentActionRequest:
      type: object
      required: [agentId]
      properties:
        agentId: {type: string}

    DiagnosticAgentSnapshot:
      type: object
      required: [agentId, displayName, expectedSourceIp, controllerIp, controllerUrl, enabled, connected, revoked, identityConfigured]
      properties:
        agentId: {type: string}
        displayName: {type: string}
        expectedSourceIp: {type: string}
        controllerIp: {type: string}
        controllerUrl: {type: string, format: uri}
        region: {type: string}
        provider: {type: string}
        networkGroup: {type: string}
        enabled: {type: boolean}
        connected:
          type: boolean
          description: True after a recent accepted signed heartbeat, using a three-interval grace window of at least 90 seconds.
        createdAt: {type: string, format: date-time}
        enrollmentExpiresAt: {type: string, format: date-time}
        enrollmentUsedAt: {type: string, format: date-time}
        enrolledAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        agentVersion: {type: string}
        capabilities: {type: array, items: {type: string}}
        health: {type: string, enum: [healthy, degraded, unhealthy, starting]}
        revokedAt:
          type: string
          format: date-time
          description: Always present. A never-revoked agent reports the Go zero time 0001-01-01T00:00:00Z, so clients must branch on revoked instead.
        revoked: {type: boolean}
        identityConfigured: {type: boolean}
        observationKeySet: {type: boolean}

    DiagnosticAgentsSnapshot:
      type: object
      required: [enabled, agents]
      properties:
        enabled: {type: boolean}
        agents:
          type: array
          items: {$ref: '#/components/schemas/DiagnosticAgentSnapshot'}

    DiagnosticAgentCreation:
      type: object
      required: [agent, enrollmentToken, compose]
      properties:
        agent: {$ref: '#/components/schemas/DiagnosticAgentSnapshot'}
        enrollmentToken:
          type: string
          writeOnly: true
          description: One-time secret returned only by create or reissue.
        compose:
          type: string
          writeOnly: true
          description: Personalized Linux Docker Compose containing the one-time enrollment values.

    CreateDiagnosticSessionRequest:
      type: object
      required: [stableId, agentId]
      properties:
        stableId: {type: string}
        agentId: {type: string}
        profileId:
          type: string
          description: Diagnostic to run, from the profiles listed by GET /api/v1/admin/diagnostic-sessions. Omitted keeps the profile matching the controller's configured check method. A profile the selected agent does not advertise is rejected with 409.

    DiagnosticFailureEvidence:
      type: object
      properties:
        code: {type: string, enum: [configuration, dns, tcp_refused, tcp_timeout, host_unreachable, network_unreachable, proxy_handshake, proxy_timeout, tls, http_status, source_ip_unchanged, download_incomplete, check_endpoint, unknown]}
        stage: {type: string, enum: [configuration, xray_start, proxy, tcp, ping, direct, endpoint]}

    DiagnosticCheckEvidence:
      type: object
      required: [checked, online]
      properties:
        checked: {type: boolean}
        online: {type: boolean}
        latencyMillis: {type: integer, format: int64, minimum: 0}
        failureCode: {type: string, enum: [configuration, dns, tcp_refused, tcp_timeout, host_unreachable, network_unreachable, proxy_handshake, proxy_timeout, tls, http_status, source_ip_unchanged, download_incomplete, check_endpoint, unknown]}

    DiagnosticJob:
      type: object
      required: [schemaVersion, jobId, sessionId, agentId, nonce, stableId, configGeneration, configFingerprint, profile, createdAt, expiresAt, state]
      properties:
        schemaVersion: {type: integer, enum: [1]}
        jobId: {type: string}
        sessionId: {type: string}
        agentId: {type: string}
        nonce: {type: string}
        stableId: {type: string}
        configGeneration: {type: integer, format: int64}
        configFingerprint: {type: string}
        profile:
          type: object
          required: [id, method]
          properties:
            id: {type: string}
            method: {type: string, enum: [ip, status, download]}
            alternativeProfileId: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        state: {type: string, enum: [pending, dispatched, running, completed, expired, cancelled]}

    DiagnosticObservation:
      type: object
      required: [schemaVersion, agentId, sessionId, jobId, nonce, stableId, configGeneration, configFingerprint, checkedAt, durationMillis, endpointProfile, status, tcp, ping, directConnectivity, agentVersion, signature]
      properties:
        schemaVersion: {type: integer, enum: [2]}
        agentId: {type: string}
        sessionId: {type: string}
        jobId: {type: string}
        nonce: {type: string}
        stableId: {type: string}
        configGeneration: {type: integer, format: int64}
        configFingerprint: {type: string}
        checkedAt: {type: string, format: date-time}
        durationMillis: {type: integer, format: int64, minimum: 0}
        endpointProfile: {type: string}
        status: {type: string, enum: [unknown, online, proxy_failure, offline]}
        latencyMillis: {type: integer, format: int64, minimum: 0}
        failure: {$ref: '#/components/schemas/DiagnosticFailureEvidence'}
        tcp: {$ref: '#/components/schemas/DiagnosticCheckEvidence'}
        ping: {$ref: '#/components/schemas/DiagnosticCheckEvidence'}
        directConnectivity: {$ref: '#/components/schemas/DiagnosticCheckEvidence'}
        alternativeEndpoint: {$ref: '#/components/schemas/DiagnosticAlternativeEndpoint'}
        throughput:
          allOf: [{$ref: '#/components/schemas/DiagnosticThroughputEvidence'}]
          description: Present only for the download profile.
        latencySeries:
          allOf: [{$ref: '#/components/schemas/DiagnosticLatencySeries'}]
          description: Present only for the latency profile.
        stability:
          allOf: [{$ref: '#/components/schemas/DiagnosticStabilityEvidence'}]
          description: Present only for the stability profile.
        tls:
          allOf: [{$ref: '#/components/schemas/DiagnosticTLSEvidence'}]
          description: Present only for the TLS profile, which runs without the tunnel.
        dns:
          allOf: [{$ref: '#/components/schemas/DiagnosticDNSEvidence'}]
          description: Present only for the DNS profile, which runs without the tunnel.
        agentVersion: {type: string}
        signature: {type: string, format: byte, writeOnly: true}

    DiagnosticAlternativeEndpoint:
      type: object
      description: Result of retrying a failed tunnelled probe against a second endpoint, which separates an unreachable endpoint from an unreachable node.
      required: [profileId, status]
      properties:
        profileId: {type: string}
        status: {type: string, enum: [unknown, online, proxy_failure, offline]}
        latencyMillis: {type: integer, format: int64, minimum: 0}
        failure: {$ref: '#/components/schemas/DiagnosticFailureEvidence'}

    DiagnosticThroughputEvidence:
      type: object
      required: [bytes, durationMillis, mbps]
      properties:
        bytes: {type: integer, format: int64, minimum: 0}
        durationMillis: {type: integer, format: int64, minimum: 0}
        mbps: {type: integer, format: int64, minimum: 0}
        ttfbMillis: {type: integer, format: int64, minimum: 0}

    DiagnosticLatencySeries:
      type: object
      required: [samples, succeeded]
      properties:
        samples: {type: integer, minimum: 1}
        succeeded: {type: integer, minimum: 0}
        minMillis: {type: integer, format: int64, minimum: 0}
        medianMillis: {type: integer, format: int64, minimum: 0}
        p95Millis: {type: integer, format: int64, minimum: 0}
        maxMillis: {type: integer, format: int64, minimum: 0}
        jitterMillis: {type: integer, format: int64, minimum: 0}
        failureCode: {type: string}

    DiagnosticStabilityEvidence:
      type: object
      required: [plannedMillis, heldMillis, bytes, interrupted]
      properties:
        plannedMillis: {type: integer, format: int64, minimum: 0}
        heldMillis: {type: integer, format: int64, minimum: 0}
        bytes: {type: integer, format: int64, minimum: 0}
        interrupted: {type: boolean}
        failureCode: {type: string}

    DiagnosticTLSEvidence:
      type: object
      required: [checked, handshake]
      properties:
        checked: {type: boolean}
        handshake: {type: boolean}
        serverName: {type: string}
        negotiatedVersion: {type: string}
        negotiatedProtocol: {type: string}
        certificateIssuer: {type: string}
        certificateExpiry: {type: string, format: date-time}
        latencyMillis: {type: integer, format: int64, minimum: 0}
        failureCode: {type: string}

    DiagnosticDNSResolverEvidence:
      type: object
      required: [resolver]
      properties:
        resolver: {type: string}
        addresses: {type: array, items: {type: string}}
        latencyMillis: {type: integer, format: int64, minimum: 0}
        failureCode: {type: string}

    DiagnosticDNSEvidence:
      type: object
      required: [checked]
      properties:
        checked: {type: boolean}
        hostname: {type: string}
        literal: {type: boolean, description: True when the node is addressed by IP, so no lookup was performed.}
        resolvers: {type: array, items: {$ref: '#/components/schemas/DiagnosticDNSResolverEvidence'}}
        mismatch: {type: boolean, description: True when resolvers returned no address in common.}

    DiagnosticProfile:
      type: object
      description: A selectable diagnostic. Jobs carry the ID only; the endpoints behind it belong to the agent's own configuration.
      required: [id, method, capability, label, summary, tunnelled, default]
      properties:
        id: {type: string}
        method: {type: string, enum: [ip, status, download, latency, stability, tls, dns]}
        capability: {type: string, enum: [diagnostic-v1, diagnostic-v2]}
        label: {type: string}
        summary: {type: string}
        tunnelled: {type: boolean, description: False for probes that reach the node directly instead of through the tunnel.}
        default: {type: boolean, description: True for the profile matching the controller's configured check method.}

    DiagnosticSessionView:
      type: object
      description: A session paired with the controller-derived plain-language summary shown in the admin UI.
      required: [session, summary]
      properties:
        session: {$ref: '#/components/schemas/DiagnosticSession'}
        summary: {type: string}

    DiagnosticAutomationSnapshot:
      type: object
      required: [enabled, speedFallbackEnabled, cooldownSeconds, alertWaitSeconds, maxConcurrent, active]
      properties:
        enabled: {type: boolean}
        speedFallbackEnabled: {type: boolean}
        cooldownSeconds: {type: integer, minimum: 0}
        alertWaitSeconds: {type: integer, minimum: 0}
        maxConcurrent: {type: integer, minimum: 0}
        active: {type: integer, minimum: 0}

    ReachabilityView:
      type: object
      required: [enabled, intervalSeconds, profileId, agents, nodes, findings, lastSweepCompleted, sweeping, divergentCells]
      properties:
        enabled: {type: boolean}
        intervalSeconds: {type: integer, minimum: 0}
        profileId: {type: string}
        agents: {type: array, items: {$ref: '#/components/schemas/ReachabilityAgent'}}
        nodes: {type: array, items: {$ref: '#/components/schemas/ReachabilityNodeRow'}}
        findings:
          type: array
          items: {$ref: '#/components/schemas/ReachabilityFinding'}
          description: >-
            Every vantage point, this checker included, that could not reach a node another vantage point
            proved alive. This is the derived list to act on; nodes carries the raw matrix.
        lastSweepAt: {type: string, format: date-time}
        lastSweepCompleted: {type: boolean}
        sweeping: {type: boolean}
        divergentCells:
          type: integer
          minimum: 0
          description: Confirmed findings only; one that was seen on a single sweep is not counted.

    ReachabilityFinding:
      type: object
      required: [stableId, local, status, tcpReached, since, streak, confirmed]
      properties:
        stableId: {type: string}
        name: {type: string}
        agentId:
          type: string
          description: Absent when the vantage point is this checker itself, which has no agent record.
        local: {type: boolean}
        status: {type: string, enum: [unknown, online, proxy_failure, offline]}
        failureCode: {type: string}
        failureStage: {type: string}
        tcpReached: {type: boolean}
        since: {type: string, format: date-time}
        streak: {type: integer, minimum: 0}
        confirmed:
          type: boolean
          description: True once the same observation has survived a second consecutive sweep.

    ReachabilityAgent:
      type: object
      required: [agentId, connected]
      properties:
        agentId: {type: string}
        displayName: {type: string}
        region: {type: string}
        provider: {type: string}
        networkGroup: {type: string}
        connected: {type: boolean}

    ReachabilityNodeRow:
      type: object
      required: [stableId, cells, alive]
      properties:
        stableId: {type: string}
        name: {type: string}
        cells: {type: array, items: {$ref: '#/components/schemas/ReachabilityCell'}}
        alive:
          type: boolean
          description: >-
            At least one vantage point reached the node. This is what turns another vantage point's failure
            into a finding rather than an ordinary outage everybody agrees on.
        localUnreachable:
          type: boolean
          description: This checker is the vantage point that cannot reach a live node.
        localSince: {type: string, format: date-time}
        localStreak: {type: integer, minimum: 0}

    ReachabilityCell:
      type: object
      required: [agentId, verdict, agentStatus, localStatus, checkedAt, tcpReached, since, streak]
      properties:
        agentId: {type: string}
        verdict:
          type: string
          enum: [unknown, agreed_up, agreed_down, agent_only_failure, local_only_failure]
          description: >-
            The stored pairwise comparison against this checker. agent_only_failure means the node answered the
            checker and not this agent; local_only_failure is the mirror image. Read `unreachable` rather than
            this field to decide whether a cell is a finding: the pairwise verdict uses the checker as the
            baseline, which is wrong exactly when the checker is the vantage point that is cut off.
        unreachable:
          type: boolean
          description: >-
            Derived from the whole row when the matrix is read, never stored. True when this vantage point could
            not reach a node another vantage point proved alive in the same sweep.
        agentStatus: {type: string, enum: [unknown, online, proxy_failure, offline]}
        localStatus: {type: string, enum: [unknown, online, proxy_failure, offline]}
        checkedAt: {type: string, format: date-time}
        localCheckedAt: {type: string, format: date-time}
        latencyMillis: {type: integer, minimum: 0}
        failureCode: {type: string}
        failureStage: {type: string}
        tcpReached:
          type: boolean
          description: Separates a path that carries nothing from one that completes TCP and then fails inside the tunnel.
        detail:
          type: string
          description: Fixed phrase explaining an unknown verdict. Never a raw transport error.
        since: {type: string, format: date-time}
        streak: {type: integer, minimum: 0, description: Consecutive sweeps that reached this verdict.}

    DiagnosticSession:
      type: object
      required: [schemaVersion, sessionId, stableId, trigger, configGeneration, configFingerprint, localResultSnapshot, requestedAgents, jobs, agentObservations, createdAt, expiresAt, state]
      properties:
        schemaVersion: {type: integer, enum: [2]}
        sessionId: {type: string}
        stableId: {type: string}
        trigger: {type: string, enum: [manual, auto_proxy_failure, auto_check_endpoint, auto_ambiguous_failure, auto_speed_fallback, reachability_sweep]}
        configGeneration: {type: integer, format: int64}
        configFingerprint: {type: string}
        localResultSnapshot: {type: object}
        automationContext:
          type: object
          description: Sanitized reason for an automatic session. URLs and raw transport errors are excluded.
          properties:
            kind: {type: string, enum: [speed_fallback]}
            outcome: {type: string, enum: [technical_error, low_speed]}
            source: {type: string}
            thresholdMbps: {type: number, format: double}
            observedMbps: {type: number, format: double}
            fallbackAttempts: {type: integer, minimum: 1}
        requestedAgents: {type: array, items: {type: string}}
        jobs: {type: array, items: {$ref: '#/components/schemas/DiagnosticJob'}}
        agentObservations:
          type: array
          items:
            type: object
            required: [observation, acceptedAt, reliable]
            properties:
              observation: {$ref: '#/components/schemas/DiagnosticObservation'}
              acceptedAt: {type: string, format: date-time}
              reliable: {type: boolean}
        maintenanceDiagnostic: {type: boolean}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        state: {type: string, enum: [requested, dispatching, running, completed, partial, expired, cancelled]}

    ProbeAgentControlRequest:
      type: object
      required: [protocolVersion, agentId]
      properties:
        protocolVersion: {type: integer, enum: [1]}
        agentId: {type: string}

    ProbeAgentEnrollRequest:
      type: object
      required: [protocolVersion, agentId, enrollmentToken, identityPublicKey, observationPublicKey, agentVersion, capabilities]
      properties:
        protocolVersion: {type: integer, enum: [1]}
        agentId: {type: string}
        enrollmentToken: {type: string, writeOnly: true}
        identityPublicKey: {type: string, format: byte}
        observationPublicKey: {type: string, format: byte}
        agentVersion: {type: string}
        capabilities: {type: array, items: {type: string}}

    ProbeAgentHeartbeatRequest:
      type: object
      required: [protocolVersion, agentId, agentVersion, capabilities, health]
      properties:
        protocolVersion: {type: integer, enum: [1]}
        agentId: {type: string}
        agentVersion: {type: string}
        capabilities: {type: array, items: {type: string}}
        health: {type: string, enum: [healthy, degraded, unhealthy, starting]}

  responses:
    Unauthorized:
      description: HTTP Basic Auth credentials are missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    Conflict:
      description: An equivalent operation is already running
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    ServerError:
      description: Operation failed after request validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    StatusOK:
      description: Operation completed
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/APIResponse'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
