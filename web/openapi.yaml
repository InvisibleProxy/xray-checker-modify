openapi: 3.0.3
info:
  title: Xray Checker API
  description: API for monitoring Xray proxies. Every `/api/v1/admin/*` operation requires explicitly configured HTTP Basic Auth credentials.
  version: "1.3"
servers:
  - url: /
security:
  - basicAuth: []

tags:
  - name: Public
  - name: Proxies
  - name: Status
  - name: Config
  - name: System
  - name: Admin

paths:
  /api/v1/public/proxies:
    get:
      summary: List all proxies (public)
      description: Returns a list of all proxies with status. No authentication required. Does not expose sensitive data like server IPs and ports.
      tags:
        - Public
      security: []
      responses:
        '200':
          description: List of proxies with public info only
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicProxyInfo'

  /api/v1/proxies:
    get:
      summary: List all proxies
      description: Returns a list of all proxies with status information
      tags:
        - Proxies
      responses:
        '200':
          description: List of proxies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProxyInfo'

  /api/v1/proxies/{stableID}:
    get:
      summary: Get proxy by ID
      description: Returns information for a specific proxy
      tags:
        - Proxies
      parameters:
        - name: stableID
          in: path
          required: true
          schema:
            type: string
          description: Proxy Stable ID (16-character hash)
      responses:
        '200':
          description: Proxy details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProxyInfo'
        '404':
          description: Proxy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/status:
    get:
      summary: Get system status
      description: Returns summary statistics about all proxies
      tags:
        - Status
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StatusResponse'

  /api/v1/config:
    get:
      summary: Get current configuration
      description: Returns the current checker configuration
      tags:
        - Config
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ConfigResponse'

  /api/v1/system/info:
    get:
      summary: Get system info
      description: Returns version, uptime, and instance information
      tags:
        - System
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemInfoResponse'

  /api/v1/system/ip:
    get:
      summary: Get current IP
      description: Returns the current detected IP address
      tags:
        - System
      responses:
        '200':
          description: Current IP address
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemIPResponse'
        '500':
          description: Failed to get IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/admin/proxies:
    get:
      summary: List proxies for the admin UI
      tags: [Admin]
      responses:
        '200':
          description: Proxy status, diagnostics, server and local SOCKS port
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminProxyInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/proxies/check:
    post:
      summary: Check selected proxy availability now
      description: Runs a targeted availability check. Previously unavailable nodes refresh TCP and ping first and skip the proxy request while TCP is unavailable.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableIDListRequest'
      responses:
        '200':
          description: Updated status and diagnostics for selected proxies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminProxyInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/subscription/refresh:
    post:
      summary: Refresh all subscription sources
      tags: [Admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRefreshRequest'
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionRefreshResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/backup:
    get:
      summary: Download a persisted-state backup
      tags: [Admin]
      responses:
        '200':
          description: ZIP archive with manifest and validated JSON state
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/admin/backup/restore:
    post:
      summary: Validate and stage a backup for the next startup
      tags: [Admin]
      parameters:
        - name: X-Xray-Checker-Action
          in: header
          required: true
          schema:
            type: string
            enum: [restore-backup]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup]
              properties:
                backup:
                  type: string
                  format: binary
      responses:
        '200':
          description: Backup staged; application restart is required
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RestoreResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Confirmation header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '413':
          description: Backup archive exceeds the configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/admin/speed-tests:
    get:
      summary: Get the current speed-test snapshot
      tags: [Admin]
      responses:
        '200':
          description: Defaults, schedule, current run and latest results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SpeedTestSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/speed-tests/run:
    post:
      summary: Start a manual speed test
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeedTestRunRequest'
      responses:
        '200':
          description: Snapshot after the run was accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SpeedTestSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/speed-tests/node-url:
    put:
      summary: Set or clear a per-node speed-test URL
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeTestURLRequest'
      responses:
        '200':
          description: Updated speed-test snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SpeedTestSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/speed-tests/history:
    get:
      summary: Get retained speed-test history for one node
      tags: [Admin]
      parameters:
        - name: stableId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive lower bound for checkedAt in RFC3339 format.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive upper bound for checkedAt in RFC3339 format.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Results ordered from newest to oldest
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SpeedTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview:
    get:
      summary: Get active and retired node summaries
      tags: [Admin]
      responses:
        '200':
          description: Long-lived node archive with availability, GeoIP and speed statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NodeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview/maintenance:
    put:
      summary: Enable or disable maintenance mode for an active node
      description: Excludes the node from availability/speed statistics, the fast recovery loop, scheduled speed tests and Telegram monitoring without deleting history. Slow full availability iterations continue as probe-only checks for Remnawave announce evaluation. Admin Check and Run remain available and do not resume monitoring. Entering maintenance closes the current downtime interval.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeMaintenanceRequest'
      responses:
        '200':
          description: Updated persisted node record
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NodeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/incidents:
    get:
      summary: Get persisted node and correlated mass incidents
      tags: [Admin]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: Incident journal ordered from newest to oldest
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/IncidentRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview/geo:
    post:
      summary: Refresh GeoIP information for selected active nodes
      description: Retired node IDs are ignored; an empty selection refreshes all active nodes only.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableIDListRequest'
      responses:
        '200':
          description: GeoIP refresh result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GeoRefreshResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview/merge/preview:
    post:
      summary: Preview a retired-node merge into an active replacement
      description: Validates subscription, protocol and server compatibility, reports changed name or port, and returns a candidate-bound confirmation token. No state is changed.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeMergePreviewRequest'
      responses:
        '200':
          description: Validated merge preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NodeMergePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview/merge:
    post:
      summary: Stage a confirmed retired-node merge for the next restart
      description: The merge is installed transactionally at startup and rolled back unless all persisted-state owners load it successfully.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeMergeRequest'
      responses:
        '200':
          description: Merge instruction staged; restart is required
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NodeMergeStageResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview/delete:
    post:
      summary: Permanently delete a retired node and its speed history
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableIDRequest'
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Permanently delete a retired node and its speed history
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableIDRequest'
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/admin/schedules:
    get:
      summary: Get the speed-test schedule
      tags: [Admin]
      responses:
        '200':
          description: Current schedule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScheduleConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Replace the speed-test schedule
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleConfig'
      responses:
        '200':
          description: Normalized saved schedule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScheduleConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/telegram:
    get:
      summary: Get editable Telegram settings without secrets
      tags: [Admin]
      responses:
        '200':
          description: Telegram settings and secret-presence flags
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TelegramAdminConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Update editable Telegram settings
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramAdminConfig'
      responses:
        '200':
          description: Normalized saved settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TelegramAdminConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/telegram/test:
    post:
      summary: Send a Telegram test message
      tags: [Admin]
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/remnawave:
    get:
      summary: Get sanitized Remnawave announce settings and topology
      description: Never returns the Remnawave API token or raw internal-squad inbound configuration.
      tags: [Admin]
      responses:
        '200':
          description: Current settings, safe topology fields and reconciliation status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RemnawaveSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Replace Remnawave announce policy and mappings
      description: Persists only non-secret policy, Internal-to-External Squad pairs and StableID-to-Host mappings.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemnawaveSettings'
      responses:
        '200':
          description: Normalized saved settings and current status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RemnawaveSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/remnawave/sync:
    post:
      summary: Refresh Remnawave topology and reconcile managed announce headers
      description: Requires the environment master switch and API connection. Unknown existing announce values are reported and left untouched.
      tags: [Admin]
      responses:
        '200':
          description: Refreshed topology and reconciliation status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RemnawaveSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:
    APIResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Response data (varies by endpoint)
        error:
          type: string
          description: Error message (only present on failure)

    APIErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Proxy not found"

    PublicProxyInfo:
      type: object
      description: Public proxy info without sensitive data (server IPs, ports)
      properties:
        stableId:
          type: string
          example: "a1b2c3d4e5f67890"
        name:
          type: string
          example: "US-Server-1"
        online:
          type: boolean
          example: true
        maintenance:
          type: boolean
          description: True when operator-paused monitoring excludes this node from availability and speed statistics.
        latencyMs:
          type: integer
          format: int64
          example: 150

    ProxyInfo:
      type: object
      properties:
        index:
          type: integer
          example: 0
        stableId:
          type: string
          example: "a1b2c3d4e5f67890"
        name:
          type: string
          example: "US-Server-1"
        subName:
          type: string
          description: Subscription name this proxy belongs to
          example: "Premium VPN"
        server:
          type: string
          example: "192.168.1.1"
        port:
          type: integer
          example: 443
        protocol:
          type: string
          enum: [vless, vmess, trojan, shadowsocks]
          example: "vless"
        proxyPort:
          type: integer
          example: 10000
        online:
          type: boolean
          example: true
        maintenance:
          type: boolean
          description: True when monitoring is paused for planned maintenance.
        latencyMs:
          type: integer
          format: int64
          example: 150

    StatusResponse:
      type: object
      properties:
        total:
          type: integer
          example: 10
        online:
          type: integer
          example: 8
        offline:
          type: integer
          example: 2
        maintenance:
          type: integer
          description: Nodes excluded from online/offline totals by maintenance mode.
          example: 1
        avgLatencyMs:
          type: integer
          format: int64
          example: 200

    ConfigResponse:
      type: object
      properties:
        checkInterval:
          type: integer
          example: 300
        recoveryInterval:
          type: integer
          description: TCP-gated fast recovery interval for unavailable nodes in seconds; 0 disables the fast loop
          example: 15
        checkMethod:
          type: string
          enum: [ip, status, download]
          example: "ip"
        timeout:
          type: integer
          example: 30
        startPort:
          type: integer
          example: 10000
        subscriptionUpdate:
          type: boolean
          example: true
        subscriptionUpdateInterval:
          type: integer
          example: 300
        simulateLatency:
          type: boolean
          example: true
        subscriptionNames:
          type: array
          description: List of unique subscription names
          items:
            type: string
          example: ["Premium VPN", "Basic VPN"]

    SystemInfoResponse:
      type: object
      properties:
        version:
          type: string
          example: "1.0.0"
        uptime:
          type: string
          example: "1h 30m 45s"
        uptimeSec:
          type: integer
          format: int64
          example: 5445
        instance:
          type: string
          example: "prod-1"

    SystemIPResponse:
      type: object
      properties:
        ip:
          type: string
          example: "203.0.113.1"

    AdminProxyInfo:
      allOf:
        - $ref: '#/components/schemas/ProxyInfo'
        - type: object
          properties:
            downSince:
              type: string
              format: date-time
            downtimeSec:
              type: integer
