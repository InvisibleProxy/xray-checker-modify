    NodeMergeNodeSnapshot:
      type: object
      required: [stableId, name, subName, server, port, protocol, active, resultCount, totalDowntimeSec, incidentCount]
      properties:
        stableId:
          type: string
        name:
          type: string
        subName:
          type: string
        server:
          type: string
        port:
          type: integer
        protocol:
          type: string
        active:
          type: boolean
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        resultCount:
          type: integer
          minimum: 0
        totalDowntimeSec:
          type: integer
          format: int64
        incidentCount:
          type: integer

    NodeMergePreview:
      type: object
      required: [source, target, mergedResultCount, confirmationToken, restartRequired, identityFieldsMatch]
      properties:
        source:
          $ref: '#/components/schemas/NodeMergeNodeSnapshot'
        target:
          $ref: '#/components/schemas/NodeMergeNodeSnapshot'
        mergedResultCount:
          type: integer
          minimum: 0
        confirmationToken:
          type: string
        restartRequired:
          type: boolean
        identityFieldsMatch:
          type: boolean
          description: True when the compatible source and target also retain the same normalized name and port.
        identityWarnings:
          type: array
          description: Human-readable name or port changes that require explicit review before staging.
          items:
            type: string

    NodeMergeStageResult:
      type: object
      required: [sourceStableId, targetStableId, restartRequired, message]
      properties:
        sourceStableId:
          type: string
        targetStableId:
          type: string
        restartRequired:
          type: boolean
        message:
          type: string

    GeoRefreshResult:
      type: object
      required: [updated, failed]
      properties:
        updated:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            type: string

    GeoSource:
      type: object
      properties:
        source:
          type: string
        ip:
          type: string
        country:
          type: string
        countryCode:
          type: string
        org:
          type: string
        asn:
          type: string
        updatedAt:
          type: string
          format: date-time
        error:
          type: string

    NodeSummary:
      type: object
      description: Persisted active or retired node, enriched with availability, GeoIP and speed statistics.
      properties:
        stableId:
          type: string
        mergedFromStableIds:
          type: array
          description: Retired StableIDs whose persisted history was merged into this node.
          items:
            type: string
        name:
          type: string
        subName:
          type: string
        server:
          type: string
        port:
          type: integer
        protocol:
          type: string
        active:
          type: boolean
        maintenance:
          type: boolean
          description: Operator-owned pause flag; independent from subscription activity.
        maintenanceSince:
          type: string
          format: date-time
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        retiredAt:
          type: string
          format: date-time
        claimedCountry:
          type: string
        claimedCountryCode:
          type: string
        geoIp:
          type: string
        geoCountry:
          type: string
        geoCountryCode:
          type: string
        geoOrg:
          type: string
        geoUpdatedAt:
          type: string
          format: date-time
        geoError:
          type: string
        totalDowntimeSec:
          type: integer
          format: int64
        incidentCount:
          type: integer
        longestDowntimeSec:
          type: integer
          format: int64
        currentDownSince:
          type: string
          format: date-time
        ipInfoUrl:
          type: string
        countryMatch:
          type: string
        geoSources:
          type: array
          items:
            $ref: '#/components/schemas/GeoSource'
        geoBlacklisted:
          type: boolean
        resultCount:
          type: integer
        successfulResults:
          type: integer
        failedResults:
          type: integer
        avgMbps:
          type: number
          format: double
        minMbps:
          type: number
          format: double
        maxMbps:
          type: number
          format: double
        lastMbps:
          type: number
          format: double
        lastSpeedAt:
          type: string
          format: date-time
        lastSpeedError:
          type: string
        lastSpeedOffline:
          type: boolean

    IncidentRecord:
      type: object
      required: [id, kind, status, scope, stableIds, affectedCount, totalCount, causeCode, causeSummary, startedAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [node, mass]
        status:
          type: string
          enum: [active, resolved]
        scope:
          type: string
        subscription:
          type: string
        stableIds:
          type: array
          items:
            type: string
        nodeNames:
          type: array
          items:
            type: string
        affectedCount:
          type: integer
        totalCount:
          type: integer
        causeCode:
          type: string
        causeSummary:
          type: string
        causeDetail:
          type: string
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        durationSec:
          type: integer
          format: int64

    TelegramAdminConfig:
      type: object
      required: [enabled, commandPollingEnabled, speedReportsEnabled, speedReportMode, nodeAlertsEnabled]
      properties:
        enabled:
          type: boolean
        commandPollingEnabled:
          type: boolean
        speedReportsEnabled:
          type: boolean
        speedReportMode:
          type: string
          enum: [always, issues, disabled]
        lowSpeedThresholdMbps:
          type: number
          format: double
        speedReportLimit:
          type: integer
        nodeAlertsEnabled:
          type: boolean
        alertCheckMinutes:
          type: integer
        alertAfterFailures:
          type: integer
        alertRepeatMinutes:
          type: integer
        alertDiagnosticsMinutes:
          type: integer
        alertReminderScheduleMinutes:
          type: array
          items:
            type: integer
        alertMaxReminderMinutes:
          type: integer
        groupOfflineReminders:
          type: boolean
        notifyRecovery:
          type: boolean
        mutedNodeIds:
          type: array
          items:
            type: string
        mutedSpeedNodeIds:
          type: array
          items:
            type: string
        mutedAlertNodeIds:
          type: array
          items:
            type: string
        botTokenConfigured:
          type: boolean
          readOnly: true
        chatConfigured:
          type: boolean
          readOnly: true
        messageThreadConfigured:
          type: boolean
          readOnly: true
        adminUserCount:
          type: integer
          readOnly: true

    RemnawaveMessageScenario:
      type: object
      required: [enabled, template]
      properties:
        enabled:
          type: boolean
          description: Whether this user-impact state may publish or retain a managed status line.
        template:
          type: string
          minLength: 1
          maxLength: 240
          description: Single-line URL-free template. Supported placeholders depend on the scenario.

    RemnawaveMessageScenarios:
      type: object
      required: [singleLocation, multipleLocations, allLocations, partialSingleLocation, partialMultipleLocations, maintenanceSingleLocation, maintenanceMultipleLocations, healthy, partialFallback, partialAvailabilityFallback, maintenanceFallback, maintenanceMixedFallback]
      properties:
        singleLocation:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Supports {location}, {unavailable}, and {total}.
        multipleLocations:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Supports {locations}, {unavailable}, and {total}.
        allLocations:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Supports {unavailable} and {total}.
        partialSingleLocation:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Used when at least one server remains healthy in one redundancy group. Supports {location}, {affected}, and {total}.
        partialMultipleLocations:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Used when at least one server remains healthy in several redundancy groups. Supports {locations}, {affected}, and {total}.
        maintenanceSingleLocation:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Used when every member of one redundancy group is offline and in maintenance. Supports {location}, {affected}, and {total}.
        maintenanceMultipleLocations:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Used when every member is offline and in maintenance in several redundancy groups. Supports {locations}, {affected}, and {total}.
        healthy:
          allOf:
            - $ref: '#/components/schemas/RemnawaveMessageScenario'
            - description: Supports {unavailable} and {total}. Disabled restores the preserved base after recovery.
        partialFallback:
          type: string
          minLength: 1
          maxLength: 240
          description: Supports {unavailable} and {total}; used for more than three unavailable locations or an oversized rendered list.
        partialAvailabilityFallback:
          type: string
          minLength: 1
          maxLength: 240
          description: Supports {affected} and {total}; used for more than three partially unavailable locations or an oversized rendered list.
        maintenanceFallback:
          type: string
          minLength: 1
          maxLength: 240
          description: Supports {affected} and {total}; used for more than three maintenance locations or an oversized rendered list.
        maintenanceMixedFallback:
          type: string
          minLength: 1
          maxLength: 240
          description: Supports {unavailable}, {affected}, and {total}; used when combined outage and maintenance messages exceed 240 characters.

    RemnawavePolicy:
      type: object
      required: [enabled, outageMinutes, minimumFailures, recoveryMinutes]
      properties:
        enabled:
          type: boolean
        outageMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        minimumFailures:
          type: integer
          minimum: 2
          maximum: 100
          description: Consecutive full availability iterations; manual and fast-recovery checks do not increment this counter.
        recoveryMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        messages:
          $ref: '#/components/schemas/RemnawaveMessageScenarios'
        normalMessage:
          type: string
          maxLength: 240
          deprecated: true
          description: Legacy v1 input accepted for compatibility and migrated to messages.healthy.

    RemnawaveSquadPair:
      type: object
      required: [internalSquadUuid, externalSquadUuid]
      properties:
        internalSquadUuid:
          type: string
        externalSquadUuid:
          type: string
        monitoringOnly:
          type: boolean
          default: false
          description: The pair participates in topology modeling but its External Squad is never targeted.

    RemnawaveNodeMapping:
      type: object
      required: [hostUuid]
      properties:
        hostUuid:
          type: string
        groupKey:
          type: string
          maxLength: 128
          description: Stable public-location redundancy key; defaults to Host UUID.
        publicLabel:
          type: string
          maxLength: 80
          description: User-facing location label; defaults to the Host remark.

    RemnawaveSettings:
      type: object
      required: [policy, squadPairs, nodeMappings]
      properties:
        policy:
          $ref: '#/components/schemas/RemnawavePolicy'
        squadPairs:
          type: array
          items:
            $ref: '#/components/schemas/RemnawaveSquadPair'
        nodeMappings:
          type: object
          description: Map keyed by exact checker StableID.
          additionalProperties:
            $ref: '#/components/schemas/RemnawaveNodeMapping'

    RemnawaveHost:
      type: object
      properties:
        uuid:
          type: string
        remark:
          type: string
        address:
          type: string
        port:
          type: integer
        isDisabled:
          type: boolean
        isHidden:
          type: boolean
        inbound:
          type: object
          properties:
            configProfileUuid:
              type: string
            configProfileInboundUuid:
              type: string
        excludedInternalSquads:
          type: array
          items:
            type: string

    RemnawaveInternalSquad:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        inbounds:
          type: array
          description: Safe identity fields only; rawInbound is never exposed.
          items:
            type: object
            properties:
              uuid:
                type: string
              profileUuid:
                type: string
              tag:
                type: string
              type:
                type: string

    RemnawaveExternalSquad:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string

    RemnawaveSnapshot:
      type: object
      required: [connection, settings, topology, proxies, status]
      properties:
        connection:
          type: object
          properties:
            enabled:
              type: boolean
            configured:
              type: boolean
            apiUrl:
              type: string
            apiTokenConfigured:
              type: boolean
        settings:
          $ref: '#/components/schemas/RemnawaveSettings'
        topology:
          type: object
          properties:
            loadedAt:
              type: string
              format: date-time
            hosts:
              type: array
              items:
                $ref: '#/components/schemas/RemnawaveHost'
            internalSquads:
              type: array
              items:
                $ref: '#/components/schemas/RemnawaveInternalSquad'
            externalSquads:
              type: array
              items:
                $ref: '#/components/schemas/RemnawaveExternalSquad'
        proxies:
          type: array
          items:
            type: object
            properties:
              stableId:
                type: string
              name:
                type: string
              subName:
                type: string
              server:
                type: string
              port:
                type: integer
              protocol:
                type: string
        status:
          type: object
          properties:
            lastTopologyAt:
              type: string
              format: date-time
            lastReconcileAt:
              type: string
              format: date-time
            lastError:
              type: string
            conflicts:
              type: array
              items:
                type: string
            announcements:
              type: array
              items:
                type: object
                properties:
                  externalSquadUuid:
                    type: string
                  externalSquadName:
                    type: string
                  present:
                    type: boolean
                  managed:
                    type: boolean
                  preservesBase:
                    type: boolean
                    description: The original single-line rwEncodeBase64 announce is preserved as the first line
                  message:
                    type: string

  responses:
    Unauthorized:
      description: HTTP Basic Auth credentials are missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    Conflict:
      description: An equivalent operation is already running
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    ServerError:
      description: Operation failed after request validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    StatusOK:
      description: Operation completed
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/APIResponse'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
