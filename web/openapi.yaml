    SpeedTestRunInfo:
      type: object
      properties:
        running:
          type: boolean
        source:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        selected:
          type: integer
        completed:
          type: integer
        error:
          type: string
        config:
          $ref: '#/components/schemas/SpeedTestConfig'

    SpeedTestResult:
      type: object
      properties:
        stableId:
          type: string
        name:
          type: string
        subName:
          type: string
        protocol:
          type: string
        url:
          type: string
        primaryUrl:
          type: string
          description: Original per-node or global Test URL when a country fallback was used.
        primaryError:
          type: string
          description: Technical error returned by the original Test URL before fallback.
        fallbackUsed:
          type: boolean
        fallbackId:
          type: string
        fallbackProvider:
          type: string
        fallbackCity:
          type: string
        fallbackCountryCode:
          type: string
          description: ISO 3166-1 alpha-2 code inferred from the node declaration, never GeoIP.
        telegramAlertSuppressed:
          type: boolean
          description: Fallback result at or above the configured low-speed threshold is omitted from automated Telegram reports and alerts.
        maintenanceProbe:
          type: boolean
          description: One-off admin speed probe for a maintenance node. It may be shown in the current admin snapshot but is not persisted in speed history or used by Telegram/statistics.
        statusCode:
          type: integer
        downloadedBytes:
          type: integer
          format: int64
        durationMs:
          type: integer
          format: int64
        ttfbMs:
          type: integer
          format: int64
        mbps:
          type: number
          format: double
        error:
          type: string
        offline:
          type: boolean
        hostCheck:
          type: object
          additionalProperties: true
        pingCheck:
          type: object
          additionalProperties: true
        checkedAt:
          type: string
          format: date-time
        source:
          type: string

    SpeedTestSnapshot:
      type: object
      required: [defaults, schedule, nodeTestUrls, lastRun, results]
      properties:
        defaults:
          $ref: '#/components/schemas/SpeedTestConfig'
        schedule:
          $ref: '#/components/schemas/ScheduleConfig'
        nodeTestUrls:
          type: object
          additionalProperties:
            type: string
