openapi: 3.0.3
info:
  title: Xray Checker API
  description: API for monitoring Xray proxies. Every `/api/v1/admin/*` operation requires explicitly configured HTTP Basic Auth credentials.
  version: "1.1"
servers:
  - url: /
security:
  - basicAuth: []

tags:
  - name: Public
  - name: Proxies
  - name: Status
  - name: Config
  - name: System
  - name: Admin

paths:
  /api/v1/public/proxies:
    get:
      summary: List all proxies (public)
      description: Returns a list of all proxies with status. No authentication required. Does not expose sensitive data like server IPs and ports.
      tags:
        - Public
      security: []
      responses:
        '200':
          description: List of proxies with public info only
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicProxyInfo'

  /api/v1/proxies:
    get:
      summary: List all proxies
      description: Returns a list of all proxies with status information
      tags:
        - Proxies
      responses:
        '200':
          description: List of proxies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProxyInfo'

  /api/v1/proxies/{stableID}:
    get:
      summary: Get proxy by ID
      description: Returns information for a specific proxy
      tags:
        - Proxies
      parameters:
        - name: stableID
          in: path
          required: true
          schema:
            type: string
          description: Proxy Stable ID (16-character hash)
      responses:
        '200':
          description: Proxy details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProxyInfo'
        '404':
          description: Proxy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/status:
    get:
      summary: Get system status
      description: Returns summary statistics about all proxies
      tags:
        - Status
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StatusResponse'

  /api/v1/config:
    get:
      summary: Get current configuration
      description: Returns the current checker configuration
      tags:
        - Config
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ConfigResponse'

  /api/v1/system/info:
    get:
      summary: Get system info
      description: Returns version, uptime, and instance information
      tags:
        - System
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemInfoResponse'

  /api/v1/system/ip:
    get:
      summary: Get current IP
      description: Returns the current detected IP address
      tags:
        - System
      responses:
        '200':
          description: Current IP address
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemIPResponse'
        '500':
          description: Failed to get IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/admin/proxies:
    get:
      summary: List proxies for the admin UI
      tags: [Admin]
      responses:
        '200':
          description: Proxy status, diagnostics, server and local SOCKS port
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminProxyInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/proxies/check:
    post:
      summary: Check selected proxy availability now
      description: Runs a targeted availability check. Previously unavailable nodes refresh TCP and ping first and skip the proxy request while TCP is unavailable.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableIDListRequest'
      responses:
        '200':
          description: Updated status and diagnostics for selected proxies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminProxyInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/subscription/refresh:
    post:
      summary: Refresh all subscription sources
      tags: [Admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRefreshRequest'
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionRefreshResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/backup:
    get:
      summary: Download a persisted-state backup
      tags: [Admin]
      responses:
        '200':
          description: ZIP archive with manifest and validated JSON state
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/admin/backup/restore:
    post:
      summary: Validate and stage a backup for the next startup
      tags: [Admin]
      parameters:
        - name: X-Xray-Checker-Action
          in: header
          required: true
          schema:
            type: string
            enum: [restore-backup]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup]
              properties:
                backup:
                  type: string
                  format: binary
      responses:
        '200':
          description: Backup staged; application restart is required
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RestoreResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Confirmation header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '413':
          description: Backup archive exceeds the configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/admin/speed-tests:
    get:
      summary: Get the current speed-test snapshot
      tags: [Admin]
      responses:
        '200':
          description: Defaults, schedule, current run and latest results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SpeedTestSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/speed-tests/run:
    post:
      summary: Start a manual speed test
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeedTestRunRequest'
      responses:
        '200':
          description: Snapshot after the run was accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SpeedTestSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/speed-tests/node-url:
    put:
      summary: Set or clear a per-node speed-test URL
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeTestURLRequest'
      responses:
        '200':
          description: Updated speed-test snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SpeedTestSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/speed-tests/history:
    get:
      summary: Get retained speed-test history for one node
      tags: [Admin]
      parameters:
        - name: stableId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Results ordered from newest to oldest
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SpeedTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview:
    get:
      summary: Get active and retired node summaries
      tags: [Admin]
      responses:
        '200':
          description: Long-lived node archive with availability, GeoIP and speed statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NodeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/incidents:
    get:
      summary: Get persisted node and correlated mass incidents
      tags: [Admin]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: Incident journal ordered from newest to oldest
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/IncidentRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview/geo:
    post:
      summary: Refresh GeoIP information for selected nodes
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableIDListRequest'
      responses:
        '200':
          description: GeoIP refresh result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GeoRefreshResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview/delete:
    post:
      summary: Permanently delete a retired node and its speed history
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableIDRequest'
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Permanently delete a retired node and its speed history
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableIDRequest'
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/admin/schedules:
    get:
      summary: Get the speed-test schedule
      tags: [Admin]
      responses:
        '200':
          description: Current schedule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScheduleConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Replace the speed-test schedule
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleConfig'
      responses:
        '200':
          description: Normalized saved schedule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScheduleConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/telegram:
    get:
      summary: Get editable Telegram settings without secrets
      tags: [Admin]
      responses:
        '200':
          description: Telegram settings and secret-presence flags
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TelegramAdminConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Update editable Telegram settings
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramAdminConfig'
      responses:
        '200':
          description: Normalized saved settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TelegramAdminConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/telegram/test:
    post:
      summary: Send a Telegram test message
      tags: [Admin]
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:
    APIResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Response data (varies by endpoint)
        error:
          type: string
          description: Error message (only present on failure)

    APIErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Proxy not found"

    PublicProxyInfo:
      type: object
      description: Public proxy info without sensitive data (server IPs, ports)
      properties:
        stableId:
          type: string
          example: "a1b2c3d4e5f67890"
        name:
          type: string
          example: "US-Server-1"
        online:
          type: boolean
          example: true
        latencyMs:
          type: integer
          format: int64
          example: 150

    ProxyInfo:
      type: object
      properties:
        index:
          type: integer
          example: 0
        stableId:
          type: string
          example: "a1b2c3d4e5f67890"
        name:
          type: string
          example: "US-Server-1"
        subName:
          type: string
          description: Subscription name this proxy belongs to
          example: "Premium VPN"
        server:
          type: string
          example: "192.168.1.1"
        port:
          type: integer
          example: 443
        protocol:
          type: string
          enum: [vless, vmess, trojan, shadowsocks]
          example: "vless"
        proxyPort:
          type: integer
          example: 10000
        online:
          type: boolean
          example: true
        latencyMs:
          type: integer
          format: int64
          example: 150

    StatusResponse:
      type: object
      properties:
        total:
          type: integer
          example: 10
        online:
          type: integer
          example: 8
        offline:
          type: integer
          example: 2
        avgLatencyMs:
          type: integer
          format: int64
          example: 200

    ConfigResponse:
      type: object
      properties:
        checkInterval:
          type: integer
          example: 300
        recoveryInterval:
          type: integer
          description: TCP-gated fast recovery interval for unavailable nodes in seconds; 0 disables the fast loop
          example: 15
        checkMethod:
          type: string
          enum: [ip, status, download]
          example: "ip"
        timeout:
          type: integer
          example: 30
        startPort:
          type: integer
          example: 10000
        subscriptionUpdate:
          type: boolean
          example: true
        subscriptionUpdateInterval:
          type: integer
          example: 300
        simulateLatency:
          type: boolean
          example: true
        subscriptionNames:
          type: array
          description: List of unique subscription names
          items:
            type: string
          example: ["Premium VPN", "Basic VPN"]

    SystemInfoResponse:
      type: object
      properties:
        version:
          type: string
          example: "1.0.0"
        uptime:
          type: string
          example: "1h 30m 45s"
        uptimeSec:
          type: integer
          format: int64
          example: 5445
        instance:
          type: string
          example: "prod-1"

    SystemIPResponse:
      type: object
      properties:
        ip:
          type: string
          example: "203.0.113.1"

    AdminProxyInfo:
      allOf:
        - $ref: '#/components/schemas/ProxyInfo'
        - type: object
          properties:
            downSince:
              type: string
              format: date-time
            downtimeSec:
              type: integer
              format: int64
            hostCheckChecked:
              type: boolean
            hostCheckOnline:
              type: boolean
            hostCheckLatencyMs:
              type: integer
              format: int64
            hostCheckTarget:
              type: string
            hostCheckError:
              type: string
            pingCheckChecked:
              type: boolean
            pingCheckOnline:
              type: boolean
            pingCheckLatencyMs:
              type: integer
              format: int64
            pingCheckTarget:
              type: string
            pingCheckError:
              type: string
            failureCode:
              type: string
            failureSummary:
              type: string
            failureDetail:
              type: string

    SubscriptionRefreshRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
        confirmationToken:
          type: string
          description: Opaque fingerprint returned by the immediately preceding suspicious-update preview

    SubscriptionRefreshResult:
      type: object
      required: [updated, count]
      properties:
        updated:
          type: boolean
        count:
          type: integer
          minimum: 0
        added:
          type: integer
        removed:
          type: integer
        changed:
          type: integer
        removedNames:
          type: array
          items:
            type: string
        requiresConfirmation:
          type: boolean
        confirmationToken:
          type: string
        message:
          type: string

    RestoreResult:
      type: object
      required: [sourceCreatedAt, files, restartRequired]
      properties:
        sourceCreatedAt:
          type: string
          format: date-time
        sourceAppVersion:
          type: string
        files:
          type: array
          items:
            type: string
        restartRequired:
          type: boolean

    SpeedTestConfig:
      type: object
      required: [url, maxBytes, timeoutSec, concurrency]
      properties:
        url:
          type: string
          format: uri
        maxBytes:
          type: integer
          format: int64
          minimum: 1
        timeoutSec:
          type: integer
          minimum: 1
        concurrency:
          type: integer
          minimum: 1

    ScheduleConfig:
      type: object
      required: [enabled, intervalSec, proxyIds, onlyOnline, subName, protocol, config]
      properties:
        enabled:
          type: boolean
        intervalSec:
          type: integer
          minimum: 0
        proxyIds:
          type: array
          items:
            type: string
        onlyOnline:
          type: boolean
        subName:
          type: string
        protocol:
          type: string
        config:
          $ref: '#/components/schemas/SpeedTestConfig'
        nodeTestUrls:
          type: object
          additionalProperties:
            type: string
            format: uri
        historyRetentionDays:
          type: integer
          minimum: 1

    SpeedTestRunRequest:
      type: object
      required: [proxyIds]
      properties:
        proxyIds:
          type: array
          minItems: 1
          items:
            type: string
        onlyOnline:
          type: boolean
        skipOffline:
          type: boolean
        subName:
          type: string
        protocol:
          type: string
        config:
          $ref: '#/components/schemas/SpeedTestConfig'

    NodeTestURLRequest:
      type: object
      required: [stableId, url]
      properties:
        stableId:
          type: string
        url:
          type: string
          description: Empty string clears the per-node override.

    SpeedTestRunInfo:
      type: object
      properties:
        running:
          type: boolean
        source:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        selected:
          type: integer
        completed:
          type: integer
        error:
          type: string
        config:
          $ref: '#/components/schemas/SpeedTestConfig'

    SpeedTestResult:
      type: object
      properties:
        stableId:
          type: string
        name:
          type: string
        subName:
          type: string
        protocol:
          type: string
        url:
          type: string
        statusCode:
          type: integer
        downloadedBytes:
          type: integer
          format: int64
        durationMs:
          type: integer
          format: int64
        ttfbMs:
          type: integer
          format: int64
        mbps:
          type: number
          format: double
        error:
          type: string
        offline:
          type: boolean
        hostCheck:
          type: object
          additionalProperties: true
        pingCheck:
          type: object
          additionalProperties: true
        checkedAt:
          type: string
          format: date-time
        source:
          type: string

    SpeedTestSnapshot:
      type: object
      required: [defaults, schedule, nodeTestUrls, lastRun, results]
      properties:
        defaults:
          $ref: '#/components/schemas/SpeedTestConfig'
        schedule:
          $ref: '#/components/schemas/ScheduleConfig'
        nodeTestUrls:
          type: object
          additionalProperties:
            type: string
        nextScheduledRunAt:
          type: string
          format: date-time
        lastRun:
          $ref: '#/components/schemas/SpeedTestRunInfo'
        results:
          type: array
          items:
            $ref: '#/components/schemas/SpeedTestResult'

    StableIDListRequest:
      type: object
      required: [stableIds]
      properties:
        stableIds:
          type: array
          items:
            type: string

    StableIDRequest:
      type: object
      required: [stableId]
      properties:
        stableId:
          type: string

    GeoRefreshResult:
      type: object
      required: [updated, failed]
      properties:
        updated:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
