  responses:
    Unauthorized:
      description: HTTP Basic Auth credentials are missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    Conflict:
      description: An equivalent operation is already running
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    ServerError:
      description: Operation failed after request validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    StatusOK:
      description: Operation completed
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/APIResponse'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
