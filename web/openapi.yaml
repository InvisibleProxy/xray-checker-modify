openapi: 3.0.3
info:
  title: Xray Checker API
  description: API for monitoring Xray proxies. Every `/api/v1/admin/*` operation requires explicitly configured HTTP Basic Auth credentials.
  version: "1.4"
servers:
  - url: /
security:
  - basicAuth: []

tags:
  - name: Public
  - name: Proxies
  - name: Status
  - name: Config
  - name: System
  - name: Admin
  - name: Probe Agents

paths:
  /api/v1/public/proxies:
    get:
      summary: List all proxies (public)
      description: Returns a list of all proxies with status. No authentication required. Does not expose sensitive data like server IPs and ports.
      tags:
        - Public
      security: []
      responses:
        '200':
          description: List of proxies with public info only
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicProxyInfo'

  /api/v1/proxies:
    get:
      summary: List all proxies
      description: Returns a list of all proxies with status information
      tags:
        - Proxies
      responses:
        '200':
          description: List of proxies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProxyInfo'

  /api/v1/proxies/{stableID}:
    get:
      summary: Get proxy by ID
      description: Returns information for a specific proxy
      tags:
        - Proxies
      parameters:
        - name: stableID
          in: path
          required: true
          schema:
            type: string
          description: Proxy Stable ID (16-character hash)
      responses:
        '200':
          description: Proxy details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProxyInfo'
        '404':
          description: Proxy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/status:
    get:
      summary: Get system status
      description: Returns summary statistics about all proxies
      tags:
        - Status
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StatusResponse'

  /api/v1/config:
    get:
      summary: Get current configuration
      description: Returns the current checker configuration
      tags:
        - Config
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ConfigResponse'

  /api/v1/system/info:
    get:
      summary: Get system info
      description: Returns version, uptime, and instance information
      tags:
        - System
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemInfoResponse'

  /api/v1/system/ip:
    get:
      summary: Get current IP
      description: Returns the current detected IP address
      tags:
        - System
      responses:
        '200':
          description: Current IP address
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemIPResponse'
        '500':
          description: Failed to get IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/admin/proxies:
    get:
      summary: List proxies for the admin UI
      tags: [Admin]
      responses:
        '200':
          description: Proxy status, diagnostics, server and local SOCKS port
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminProxyInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/proxies/check:
    post:
      summary: Check selected proxy availability now
      description: Runs a targeted availability check. Previously unavailable nodes refresh TCP and ping first and skip the proxy request while TCP is unavailable.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableIDListRequest'
      responses:
        '200':
          description: Updated status and diagnostics for selected proxies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminProxyInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/subscription/refresh:
    post:
      summary: Refresh all subscription sources
      tags: [Admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRefreshRequest'
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionRefreshResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/project-maintenance:
    get:
      summary: Read project-wide maintenance state
      tags: [Admin]
      responses:
        '200':
          description: Current project maintenance state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectMaintenanceState'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Enable or disable project-wide maintenance
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMaintenanceRequest'
      responses:
        '200':
          description: Updated project maintenance state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectMaintenanceState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/backup:
    get:
      summary: Download a persisted-state backup
      tags: [Admin]
      responses:
        '200':
          description: ZIP archive with manifest and validated JSON state
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/admin/backup/restore:
    post:
      summary: Validate and stage a backup for the next startup
      tags: [Admin]
      parameters:
        - name: X-Xray-Checker-Action
          in: header
          required: true
          schema:
            type: string
            enum: [restore-backup]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup]
              properties:
                backup:
                  type: string
                  format: binary
      responses:
        '200':
          description: Backup staged; application restart is required
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RestoreResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Confirmation header is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
        '413':
          description: Backup archive exceeds the configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'

  /api/v1/admin/speed-tests:
    get:
      summary: Get the current speed-test snapshot
      tags: [Admin]
      responses:
        '200':
          description: Defaults, schedule, current run and latest results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SpeedTestSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/speed-tests/run:
    post:
      summary: Start a manual speed test
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeedTestRunRequest'
      responses:
        '200':
          description: Snapshot after the run was accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SpeedTestSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/speed-tests/node-url:
    put:
      summary: Set or clear a per-node speed-test URL
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeTestURLRequest'
      responses:
        '200':
          description: Updated speed-test snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SpeedTestSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/speed-tests/history:
    get:
      summary: Get retained speed-test history for one node
      tags: [Admin]
      parameters:
        - name: stableId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive lower bound for checkedAt in RFC3339 format.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive upper bound for checkedAt in RFC3339 format.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Results ordered from newest to oldest
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SpeedTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/availability/history:
    get:
      summary: Get retained availability latency history for one node
      tags: [Admin]
      parameters:
        - name: stableId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive lower bound for checkedAt in RFC3339 format.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive upper bound for checkedAt in RFC3339 format.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Real availability checks ordered from newest to oldest
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AvailabilitySample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview:
    get:
      summary: Get active and retired node summaries
      tags: [Admin]
      responses:
        '200':
          description: Long-lived node archive with availability, GeoIP and speed statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NodeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview/maintenance:
    put:
      summary: Enable or disable maintenance mode for an active node
      description: Excludes the node from availability/speed statistics, the fast recovery loop, scheduled speed tests and Telegram monitoring without deleting history. Slow full availability iterations continue as probe-only checks for Remnawave announce evaluation. Admin Check and Run remain available and do not resume monitoring. Entering maintenance closes the current downtime interval.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeMaintenanceRequest'
      responses:
        '200':
          description: Updated persisted node record
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NodeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/incidents:
    get:
      summary: Get persisted node and correlated mass incidents
      tags: [Admin]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: Incident journal ordered from newest to oldest
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/IncidentRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview/geo:
    post:
      summary: Refresh GeoIP information for selected active nodes
      description: Retired node IDs are ignored; an empty selection refreshes all active nodes only.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableIDListRequest'
      responses:
        '200':
          description: GeoIP refresh result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GeoRefreshResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview/merge/preview:
    post:
      summary: Preview a retired-node merge into an active replacement
      description: Validates subscription, protocol and server compatibility, reports changed name or port, and returns a candidate-bound confirmation token. No state is changed.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeMergePreviewRequest'
      responses:
        '200':
          description: Validated merge preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NodeMergePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview/merge:
    post:
      summary: Stage a confirmed retired-node merge for the next restart
      description: The merge is installed transactionally at startup and rolled back unless all persisted-state owners load it successfully.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeMergeRequest'
      responses:
        '200':
          description: Merge instruction staged; restart is required
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NodeMergeStageResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/nodes-overview/delete:
    post:
      summary: Permanently delete a retired node and its speed history
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableIDRequest'
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Permanently delete a retired node and its speed history
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableIDRequest'
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/admin/schedules:
    get:
      summary: Get the speed-test schedule
      tags: [Admin]
      responses:
        '200':
          description: Current schedule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScheduleConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Replace the speed-test schedule
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleConfig'
      responses:
        '200':
          description: Normalized saved schedule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ScheduleConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/telegram:
    get:
      summary: Get editable Telegram settings without secrets
      tags: [Admin]
      responses:
        '200':
          description: Telegram settings and secret-presence flags
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TelegramAdminConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Update editable Telegram settings
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramAdminConfig'
      responses:
        '200':
          description: Normalized saved settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TelegramAdminConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/telegram/test:
    post:
      summary: Send a Telegram test message
      tags: [Admin]
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/remnawave:
    get:
      summary: Get sanitized Remnawave announce settings and topology
      description: Never returns the Remnawave API token or raw internal-squad inbound configuration.
      tags: [Admin]
      responses:
        '200':
          description: Current settings, safe topology fields and reconciliation status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RemnawaveSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Replace Remnawave announce policy and location mappings
      description: Persists only non-secret policy, Internal-to-External Squad pairs and location membership. Locations are the canonical announce identity; each member maps an exact checker StableID to a Remnawave Host UUID. Deprecated nodeMappings input is accepted when locations is omitted or describes the same locations.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemnawaveSettings'
      responses:
        '200':
          description: Normalized saved settings and current status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RemnawaveSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/subscription/refresh/progress:
    get:
      summary: Report which phase the current or last subscription refresh is in
      description: >-
        A refresh runs as one long request, so its phase is polled separately. Reading progress never
        interacts with the refresh itself, and the per-phase timings of the last run stay available
        afterwards so a slow refresh can be attributed to a phase rather than guessed at.
      tags: [Admin]
      responses:
        '200':
          description: Current phase, elapsed time and the phases already completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          running:
                            type: boolean
                          source:
                            type: string
                            example: manual
                          phase:
                            type: string
                            enum: [fetching, resolving, comparing, applying, finishing]
                          elapsedMs:
                            type: integer
                            format: int64
                          startedAt:
                            type: string
                            format: date-time
                          finishedAt:
                            type: string
                            format: date-time
                          failed:
                            type: boolean
                          phases:
                            type: array
                            items:
                              type: object
                              properties:
                                phase:
                                  type: string
                                durationMs:
                                  type: integer
                                  format: int64

  /api/v1/admin/remnawave/announce-base:
    post:
      summary: Adopt or forget the operator-owned announce base of an External Squad
      description: >-
        Records the announce value the squad currently holds as the text the checker may build on,
        so a multi-line operator announce can be extended with a status line. The value is captured
        by this explicit action rather than inferred during reconcile: a base that had to be guessed
        could absorb a stale status line whenever ownership state is lost, and the message would grow
        on every pass. Send release=true to forget it again.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalSquadUuid]
              properties:
                externalSquadUuid:
                  type: string
                release:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Updated settings, topology and reconciliation status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RemnawaveSnapshot'
        '400':
          description: The squad is unknown or its announce value cannot be built on

  /api/v1/admin/remnawave/locations/suggest:
    get:
      summary: Propose announce locations from Remnawave host tags
      description: >-
        Groups the current checker nodes by the tags of the hosts they run on, pairing each node to a host
        by address and port. Nothing is saved: the operator picks which tags are locations and submits them
        through PUT /api/v1/admin/remnawave like any hand-made card.
      tags: [Admin]
      responses:
        '200':
          description: Candidate locations and the nodes that matched no host
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          candidates:
                            type: array
                            items:
                              type: object
                              properties:
                                tag:
                                  type: string
                                  example: BALANCER_NL
                                members:
                                  type: array
                                  items:
                                    $ref: '#/components/schemas/RemnawaveCandidateMember'
                          unmatched:
                            type: array
                            items:
                              $ref: '#/components/schemas/RemnawaveCandidateMember'

  /api/v1/admin/remnawave/sync:
    post:
      summary: Refresh Remnawave topology and reconcile managed announce headers
      description: Requires the environment master switch and API connection. Unknown existing announce values are reported and left untouched.
      tags: [Admin]
      responses:
        '200':
          description: Refreshed topology and reconciliation status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RemnawaveSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/diagnostic-agents:
    get:
      summary: List configured diagnostic agents
      description: Returns sanitized agent state. Enrollment tokens, private keys and generated Compose are never returned by this list operation.
      tags: [Admin]
      responses:
        '200':
          description: Remote diagnostics state and configured agents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DiagnosticAgentsSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a diagnostic agent enrollment
      description: Creates an IP-bound agent and returns its one-time enrollment token and personalized Compose exactly in this response. The controller persists only a SHA-256 token hash.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiagnosticAgentRequest'
      responses:
        '200':
          description: One-time agent enrollment material
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DiagnosticAgentCreation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/diagnostic-agents/reissue:
    post:
      summary: Replace an agent identity with a new one-time enrollment
      description: Invalidates the previous enrolled identity and returns new one-time Compose material. Use after loss of the persistent identity volume.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticAgentActionRequest'
      responses:
        '200':
          description: Replacement enrollment material
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DiagnosticAgentCreation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Agent not found

  /api/v1/admin/diagnostic-agents/revoke:
    post:
      summary: Revoke a diagnostic agent
      description: Immediately rejects future enrollment and heartbeat requests from this agent.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticAgentActionRequest'
      responses:
        '200':
          description: Revoked sanitized agent state
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Agent not found

  /api/v1/admin/diagnostic-agents/delete:
    post:
      summary: Delete a revoked diagnostic agent
      description: Permanently removes the revoked agent record and saved public identities from the controller registry. It does not remove the remote Compose stack or identity volume.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticAgentActionRequest'
      responses:
        '200':
          description: Deleted agent ID
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Agent not found
        '409':
          description: Agent must be revoked before deletion

  /api/v1/admin/diagnostic-sessions:
    get:
      summary: List ephemeral remote diagnostic sessions
      description: Optionally filters by StableID. Returned sessions contain no Xray execution config, credentials or raw transport errors.
      tags: [Admin]
      parameters:
        - in: query
          name: stableId
          schema: {type: string}
      responses:
        '200':
          description: Isolated diagnostic sessions together with the selectable profile catalogue
          content:
            application/json:
              schema:
                type: object
                required: [enabled, automation, profiles, sessions]
                properties:
                  enabled: {type: boolean}
                  automation:
                    $ref: '#/components/schemas/DiagnosticAutomationSnapshot'
                  profiles: {type: array, items: {$ref: '#/components/schemas/DiagnosticProfile'}}
                  sessions: {type: array, items: {$ref: '#/components/schemas/DiagnosticSessionView'}}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Start manual diagnostics through one connected agent
      description: Creates an in-memory session and queues a generation-bound job without changing authoritative availability state. Returns 409 while the same agent already has an active session for the same StableID.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiagnosticSessionRequest'
      responses:
        '200':
          description: Created diagnostic session
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/reachability:
    get:
      summary: Per-agent reachability matrix
      description: >-
        Reports what each connected probe agent last saw for each monitored node, next to the checker's own
        result for the same node. Only disagreements are findings: a node reachable here and not from an agent,
        or the reverse. The matrix is advisory and never writes availability, downtime, incidents or Remnawave.
        Cells carry a streak, and divergentCells counts only disagreements that survived a second sweep.
      tags: [Admin]
      responses:
        '200':
          description: Current matrix with one column per agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReachabilityView'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Run a reachability sweep now
      description: >-
        Starts one pass in the background and returns the current snapshot with sweeping set. A request made
        while a pass is already running is ignored rather than queued. With stableId the pass covers only that
        node, which is how one finding is confirmed or cleared without asking every agent about every node;
        repeating it cannot manufacture a confirmation, because the streak only advances once the checker's own
        result has been refreshed. Manual diagnostic sessions never write to the matrix — use this instead.
      tags: [Admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                stableId:
                  type: string
                  description: Recheck only this node. Omit or leave empty to sweep everything.
      responses:
        '200':
          description: Snapshot taken as the sweep was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReachabilityView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: The reachability sweep is disabled

  /api/v1/admin/diagnostic-sessions/cancel:
    post:
      summary: Cancel an active diagnostic session
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: {type: string}
      responses:
        '200':
          description: Session cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session not found

  /api/v1/admin/diagnostic-sessions/delete:
    post:
      summary: Remove one diagnostic session
      description: Discards the session and any queued assignment for it, so an agent cannot keep running a job whose result would no longer be accepted. Cancelling only stops a session; this removes it.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: {type: string}
      responses:
        '200':
          description: Session removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session not found

  /api/v1/admin/diagnostic-sessions/clear:
    post:
      summary: Remove every diagnostic session for a node
      description: An empty stableId clears every node, which is why the field must be sent explicitly rather than omitted.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stableId]
              properties:
                stableId: {type: string}
      responses:
        '200':
          description: Sessions removed
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: {type: integer, minimum: 0}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/diagnostic-sessions/export:
    get:
      summary: Download a sanitized diagnostic session as JSON
      tags: [Admin]
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Sanitized session JSON without execution credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiagnosticSession'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session not found

  /api/v1/agent/enroll:
    post:
      summary: Enroll a new outbound-only diagnostic agent
      description: Requires the exact configured source IP and an unexpired one-time token. Registers distinct Ed25519 identity and observation public keys.
      tags: [Probe Agents]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeAgentEnrollRequest'
      responses:
        '200':
          description: Enrollment accepted
        '403':
          description: Agent authentication failed

  /api/v1/agent/heartbeat:
    post:
      summary: Submit a signed diagnostic-agent heartbeat
      description: Requires exact source IP, Ed25519 signature, bounded timestamp skew and a persisted monotonically increasing sequence number.
      tags: [Probe Agents]
      security: []
      parameters:
        - in: header
          name: X-Probe-Agent-ID
          required: true
          schema: {type: string}
        - in: header
          name: X-Probe-Timestamp
          required: true
          schema: {type: string, format: date-time}
        - in: header
          name: X-Probe-Sequence
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - in: header
          name: X-Probe-Signature
          required: true
          schema: {type: string, format: byte}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeAgentHeartbeatRequest'
      responses:
        '200':
          description: Heartbeat accepted
        '403':
          description: Agent authentication failed

  /api/v1/agent/jobs/next:
    post:
      summary: Poll for the next signed-agent diagnostic job
      description: Uses the same exact source-IP, Ed25519 identity, timestamp and persisted monotonic sequence checks as heartbeat. Credential-bearing execution config is returned only here and is never placed in session exports.
      tags: [Probe Agents]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProbeAgentControlRequest'}
      responses:
        '200':
          description: A bounded job assignment or an empty result
        '403':
          description: Agent authentication failed

  /api/v1/agent/observations:
    post:
      summary: Submit a signed remote diagnostic observation
      description: Requires both the identity-signed transport request and an observation signature bound to session, job, nonce, StableID, generation, fingerprint and endpoint profile.
      tags: [Probe Agents]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DiagnosticObservation'}
      responses:
        '200':
          description: Observation accepted into the isolated in-memory session
        '403':
          description: Agent authentication failed
        '409':
          description: Observation signature, replay, binding, age or generation check failed

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:
    APIResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Response data (varies by endpoint)
        error:
          type: string
          description: Error message (only present on failure)

    APIErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Proxy not found"

    PublicProxyInfo:
      type: object
      description: Public proxy info without sensitive data (server IPs, ports)
      properties:
        stableId:
          type: string
          example: "a1b2c3d4e5f67890"
        name:
          type: string
          example: "US-Server-1"
        online:
          type: boolean
          description: True unless every availability diagnostic failed; proxy_failure nodes remain host-reachable.
          example: true
        status:
          type: string
          enum: [online, proxy_failure, offline]
        proxyHealthy:
          type: boolean
          description: True only when the real proxy check succeeded.
        maintenance:
          type: boolean
          description: True when operator-paused monitoring excludes this node from availability and speed statistics.
        latencyMs:
          type: integer
          format: int64
          example: 150

    AvailabilitySample:
      type: object
      required: [checkedAt, online, status, latencyMs]
      properties:
        checkedAt:
          type: string
          format: date-time
        online:
          type: boolean
          description: False only for hard offline; proxy_failure remains reachable.
        status:
          type: string
          enum: [online, proxy_failure, offline]
        latencyMs:
          type: integer
          format: int64
          minimum: 0
          description: Proxy check latency in milliseconds; zero for proxy_failure and offline checks.
        failureCode:
          type: string
        failureSummary:
          type: string

    ProxyInfo:
      type: object
      properties:
        index:
          type: integer
          example: 0
        stableId:
          type: string
          example: "a1b2c3d4e5f67890"
        name:
          type: string
          example: "US-Server-1"
        subName:
          type: string
          description: Subscription name this proxy belongs to
          example: "Premium VPN"
        server:
          type: string
          example: "192.168.1.1"
        port:
          type: integer
          example: 443
        protocol:
          type: string
          enum: [vless, vmess, trojan, shadowsocks]
          example: "vless"
        proxyPort:
          type: integer
          example: 10000
        online:
          type: boolean
          description: True unless every availability diagnostic failed; inspect status and proxyHealthy for service health.
          example: true
        status:
          type: string
          enum: [online, proxy_failure, offline]
        proxyHealthy:
          type: boolean
          description: True only when the real proxy check succeeded.
        maintenance:
          type: boolean
          description: True when monitoring is paused for planned maintenance.
        latencyMs:
          type: integer
          format: int64
          example: 150

    StatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [operational, degraded, unknown, maintenance]
        total:
          type: integer
          example: 10
        online:
          type: integer
          example: 8
        offline:
          type: integer
          example: 2
        unknown:
          type: integer
          description: Nodes without a current authoritative availability result.
        proxyFailures:
          type: integer
          description: Reachable nodes whose real proxy check failed.
        maintenance:
          type: integer
          description: Nodes excluded from online/offline totals by maintenance mode.
          example: 1
        avgLatencyMs:
          type: integer
          format: int64
          example: 200
        projectMaintenance:
          type: boolean
          description: True while project-wide automatic operational workflows are paused.
        projectMaintenanceSince:
          type: string
          format: date-time

    ConfigResponse:
      type: object
      properties:
        checkInterval:
          type: integer
          example: 300
        recoveryInterval:
          type: integer
          description: TCP-gated fast recovery interval for unavailable nodes in seconds; 0 disables the fast loop
          example: 15
        checkMethod:
          type: string
          enum: [ip, status, download]
          example: "ip"
        timeout:
          type: integer
          example: 30
        startPort:
          type: integer
          example: 10000
        subscriptionUpdate:
          type: boolean
          example: true
        subscriptionUpdateInterval:
          type: integer
          example: 300
        simulateLatency:
          type: boolean
          example: true
        subscriptionNames:
          type: array
          description: List of unique subscription names
          items:
            type: string
          example: ["Premium VPN", "Basic VPN"]

    SystemInfoResponse:
      type: object
      properties:
        version:
          type: string
          example: "1.0.0"
        uptime:
          type: string
          example: "1h 30m 45s"
        uptimeSec:
          type: integer
          format: int64
          example: 5445
        instance:
          type: string
          example: "prod-1"

    SystemIPResponse:
      type: object
      properties:
        ip:
          type: string
          example: "203.0.113.1"

    AdminProxyInfo:
      allOf:
        - $ref: '#/components/schemas/ProxyInfo'
        - type: object
          properties:
            downSince:
              type: string
              format: date-time
            downtimeSec:
              type: integer
              format: int64
            proxyFailureSince:
              type: string
              format: date-time
            proxyFailureSec:
              type: integer
              format: int64
            hostCheckChecked:
              type: boolean
            hostCheckOnline:
              type: boolean
            hostCheckLatencyMs:
              type: integer
              format: int64
            hostCheckTarget:
              type: string
            hostCheckError:
              type: string
            pingCheckChecked:
              type: boolean
            pingCheckOnline:
              type: boolean
            pingCheckLatencyMs:
              type: integer
              format: int64
            pingCheckTarget:
              type: string
            pingCheckError:
              type: string
            failureCode:
              type: string
            failureSummary:
              type: string
            failureDetail:
              type: string

    ProjectMaintenanceRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    ProjectMaintenanceState:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        since:
          type: string
          format: date-time

    SubscriptionRefreshRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
        confirmationToken:
          type: string
          description: Opaque fingerprint returned by the immediately preceding suspicious-update preview

    SubscriptionRefreshResult:
      type: object
      required: [updated, count]
      properties:
        updated:
          type: boolean
        count:
          type: integer
          minimum: 0
        added:
          type: integer
        removed:
          type: integer
        changed:
          type: integer
        removedNames:
          type: array
          items:
            type: string
        requiresConfirmation:
          type: boolean
        confirmationToken:
          type: string
        message:
          type: string

    RestoreResult:
      type: object
      required: [sourceCreatedAt, files, restartRequired]
      properties:
        sourceCreatedAt:
          type: string
          format: date-time
        sourceAppVersion:
          type: string
        files:
          type: array
          items:
            type: string
        restartRequired:
          type: boolean

    SpeedTestConfig:
      type: object
      required: [url, maxBytes, timeoutSec, concurrency]
      properties:
        url:
          type: string
          format: uri
        maxBytes:
          type: integer
          format: int64
          minimum: 1
        timeoutSec:
          type: integer
          minimum: 1
        concurrency:
          type: integer
          minimum: 1

    ScheduleConfig:
      type: object
      required: [enabled, intervalSec, proxyIds, onlyOnline, subName, protocol, config]
      properties:
        enabled:
          type: boolean
        intervalSec:
          type: integer
          minimum: 0
        proxyIds:
          type: array
          items:
            type: string
        onlyOnline:
          type: boolean
          description: Legacy/UI filter value. Scheduled execution always requires effective status online even when this value is false.
        subName:
          type: string
        protocol:
          type: string
        config:
          $ref: '#/components/schemas/SpeedTestConfig'
        nodeTestUrls:
          type: object
          additionalProperties:
            type: string
            format: uri
        historyRetentionDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: Shared age-based retention period for speed-test and availability histories.

    SpeedTestRunRequest:
      type: object
      required: [proxyIds]
      properties:
        proxyIds:
          type: array
          minItems: 1
          items:
            type: string
        onlyOnline:
          type: boolean
          description: The admin manual-run handler forces this to true after its availability check.
        skipOffline:
          type: boolean
          description: The admin manual-run handler forces this to true; a node that becomes unavailable before transfer is skipped without a result/history entry.
        subName:
          type: string
        protocol:
          type: string
        config:
          $ref: '#/components/schemas/SpeedTestConfig'

    NodeTestURLRequest:
      type: object
      required: [stableId, url]
      properties:
        stableId:
          type: string
        url:
          type: string
          description: Empty string clears the per-node override.

    SpeedTestRunInfo:
      type: object
      properties:
        running:
          type: boolean
        source:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        selected:
          type: integer
        completed:
          type: integer
        error:
          type: string
        config:
          $ref: '#/components/schemas/SpeedTestConfig'

    SpeedTestResult:
      type: object
      properties:
        stableId:
          type: string
        name:
          type: string
        subName:
          type: string
        protocol:
          type: string
        url:
          type: string
        primaryUrl:
          type: string
          description: Original per-node or global Test URL when a country fallback was used.
        primaryError:
          type: string
          description: Technical error returned by the original Test URL before fallback.
        primaryMbps:
          type: number
          format: double
          description: Original Test URL rate when a country fallback produced the final result.
        fallbackAttempted:
          type: boolean
          description: At least one country fallback endpoint was actually attempted.
        fallbackAttempts:
          type: integer
          minimum: 0
          description: Number of distinct country fallback candidates attempted.
        fallbackExhausted:
          type: boolean
          description: Every attempted country fallback candidate failed, so the original result remained final.
        fallbackUsed:
          type: boolean
        fallbackId:
          type: string
        fallbackProvider:
          type: string
        fallbackCity:
          type: string
        fallbackCountryCode:
          type: string
          description: ISO 3166-1 alpha-2 code inferred from the node declaration, never GeoIP.
        telegramAlertSuppressed:
          type: boolean
          description: Fallback result at or above the configured low-speed threshold is omitted from automated Telegram reports and alerts.
        maintenanceProbe:
          type: boolean
          description: One-off admin speed probe during node or project maintenance. It may be shown in the current admin snapshot but is not persisted in speed history or used by Telegram/statistics.
        projectMaintenanceProbe:
          type: boolean
          description: True when the ephemeral admin probe was run during project-wide maintenance.
        statusCode:
          type: integer
        downloadedBytes:
          type: integer
          format: int64
        durationMs:
          type: integer
          format: int64
        ttfbMs:
          type: integer
          format: int64
        mbps:
          type: number
          format: double
        error:
          type: string
        offline:
          type: boolean
        hostCheck:
          type: object
          additionalProperties: true
        pingCheck:
          type: object
          additionalProperties: true
        checkedAt:
          type: string
          format: date-time
